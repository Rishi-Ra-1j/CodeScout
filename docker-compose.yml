services:
  db:
    image: pgvector/pgvector:pg16
    environment: 
      POSTGRES_USER: codescout
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: codescout
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api: 
    build: .
    env_file: .env
    environment: 
      DB_HOST: db
      DB_PORT: "5432"
    ports: 
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
volumes: 
  pgdata:
